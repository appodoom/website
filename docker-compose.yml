services:
  db:
    image: postgres:16
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: always
    ports:
      - "5050:80"
    env_file:
      - .env
    depends_on:
      - db

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      - db
      - web
      - percussion-engine

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      - db

  percussion-engine:
    build:
      context: ./percussion-engine
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env
    ports:
      - "3001:3001"
    depends_on:
      - db

volumes:
  pgdata:
