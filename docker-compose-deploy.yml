services:
  db:
    image: postgres:16
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    network:
      - appnet

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: always
    ports:
      - "5050:80"
    env_file:
      - .env
    depends_on:
      - db
    network:
      - appnet

  gateway:
    image: appodoom/api-gateway
    restart: always
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      - db
      - web
      - generate
    network:
      - appnet

  web:
    image: appodoom/web-server
    restart: always
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      - db
    network:
      - appnet

  generate:
    image: appodoom/api
    restart: always
    env_file:
      - .env
    ports:
      - "3001:3001"
    depends_on:
      - db
    network:
      - appnet

  inference-model:
    image: appodoom/inference-model
    restart: always
    env_file:
      - .env
    ports:
      - "5000:5000"
    network:
      - appnet

volumes:
  pgdata:

network:
  appnet:
