<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DerboukaGPT – Admin Panel</title>
    <link rel="stylesheet" href="/web/shared/css/global.css" />
    <link rel="stylesheet" href="index.css" />
  </head>

  <body>
    <header>
      <div class="navbar">
        <div class="brand big-logo"></div>

        <div class="admin-navbar-right">
          <div class="user-menu-container">
            <button class="user-menu-toggle" id="userMenuToggle" type="button">
              <span class="username" id="usernameDisplay">Loading...</span>
              <span class="dropdown-arrow">▼</span>
            </button>

            <div class="user-dropdown" id="userDropdown">
              <div class="dropdown-content" id="dropdownContent"></div>
            </div>
          </div>
        </div>
      </div>
    </header>

    <main class="admin-page">
      <div class="container admin-shell">
        <aside class="admin-sidebar">
          <div class="admin-sidebar-title">Administration</div>

          <nav class="admin-nav">
            <button class="admin-nav-btn active" id="nav-users" type="button">
              Edit users
            </button>
            <button class="admin-nav-btn" id="nav-questions" type="button">
              Edit rating questions
            </button>
            <button class="admin-nav-btn" id="nav-tags" type="button">
              Edit tags
            </button>
            <button
              class="admin-nav-btn"
              id="nav-analytics"
              type="button"
              type="button"
            >
              View Analytics
            </button>
          </nav>
        </aside>

        <section class="admin-main">
          <div id="main_content"></div>
        </section>
      </div>
    </main>
    <footer class="footer">
      <div class="footer-inner">
        <div class="footer-left">© 2026 DerboukaGPT</div>

        <div class="footer-right">
          <a href="/web/">Home</a>
          <a href="/web/#about">About</a>
          <a href="/web/#blog">Blog</a>
          <a href="/web/#code">Code</a>
          <a href="/web/#contact">Contact</a>
          <a href="https://github.com/appodoom/">GitHub</a>
        </div>
      </div>
    </footer>

    <button id="dummy" type="button" hidden></button>
    <div id="toast-container" class="toast-container"></div>

    <!-- PAGE 0: USERS -->
    <template id="page-0">
      <section class="admin-view">
        <div class="admin-view-header">
          <h1 class="admin-view-title">Edit Users</h1>
          <p class="admin-view-subtitle">
            Review user accounts and update access roles.
          </p>
        </div>

        <div class="panel admin-panel">
          <div class="users" id="usersList"></div>
        </div>

        <div class="admin-actions">
          <button class="btn btn-primary main_content_submit" type="button">
            Submit changes
          </button>
        </div>
      </section>
    </template>

    <!-- PAGE 1: QUESTIONS -->
    <template id="page-1">
      <section class="admin-view">
        <div class="admin-view-header">
          <h1 class="admin-view-title">Edit Rating Questions</h1>
          <p class="admin-view-subtitle">
            Manage which questions appear in the evaluation workflow.
          </p>
        </div>

        <div class="panel admin-panel">
          <div class="questions" id="questionsList"></div>
        </div>

        <div class="admin-actions">
          <button class="btn btn-primary main_content_submit" type="button">
            Submit changes
          </button>
          <button class="btn" id="add_question" type="button">
            Add a question
          </button>
        </div>
      </section>
    </template>

    <template id="page-2">
      <section class="admin-view">
        <div class="admin-view-header">
          <h1 class="admin-view-title">Edit tags</h1>
          <p class="admin-view-subtitle">
            Manage available tags that can be attached to generated audio.
          </p>
        </div>

        <div class="panel admin-panel">
          <div class="tags tagsList" id="tagsList"></div>
        </div>

        <div class="admin-actions">
          <button class="btn btn-primary main_content_submit" type="button">
            Submit changes
          </button>
          <button class="btn" id="add_tag" type="button">Add a tag</button>
        </div>
      </section>
    </template>

    <template id="page-3">
      <section class="admin-view">
        <div class="admin-view-header">
          <h1 class="admin-view-title">View Analytics</h1>
          <p class="admin-view-subtitle">
            Get information about existing data.
          </p>
        </div>

        <div class="analytics" id="analyticsContainer"></div>
      </section>
    </template>

    <script type="module" src="navigation.js"></script>
  </body>
</html>
