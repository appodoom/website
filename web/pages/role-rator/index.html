<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DerboukaGPT - Rating</title>
    <link rel="stylesheet" href="/web/shared/css/global.css" />
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <header>
      <div class="navbar">
        <div class="brand big-logo"></div>
        <div class="page-navbar-right">
          <div class="user-menu-container">
            <button class="user-menu-toggle" id="userMenuToggle" type="button">
              <span class="username" id="usernameDisplay"> Loading... </span>
              <span class="dropdown-arrow">▼</span>
            </button>
            <div class="user-dropdown" id="userDropdown">
              <div class="dropdown-content" id="dropdownContent"></div>
            </div>
          </div>
        </div>
      </div>
    </header>
    <main class="library-page">
      <div class="container library-shell">
        <section class="library-panel">
          <div class="library-header">
            <h1 class="library-title" id="pageTitle">Audio Library</h1>
            <p class="library-subtitle" id="breadcrumb">Library</p>
          </div>
          <div id="main_content"></div>
        </section>
      </div>
    </main>
    <footer class="footer">
      <div class="footer-inner">
        <div class="footer-left">© 2026 DerboukaGPT</div>
        <div class="footer-right">
          <a href="/web/">Home</a>
          <a href="/web/#about">About</a>
          <a href="/web/#blog">Blog</a>
          <a href="/web/#code">Code</a>
          <a href="/web/#contact">Contact</a>
          <a href="https://github.com/appodoom/">GitHub</a>
        </div>
      </div>
    </footer>
    <div id="toast-container" class="toast-container"></div>
    <template id="page-0">
      <div class="panel explorer-panel">
        <div class="panel-title">Audio Files</div>
        <div id="fileContainer" class="file-container">Loading...</div>
      </div>
    </template>
    <template id="page-1">
      <div class="player-page">
        <button class="btn" id="backButton" type="button">← Back</button>
        <div class="panel">
          <div class="panel-title">Audio Player</div>
          <div id="audioContainer" class="audio-placeholder">Loading...</div>
        </div>
        <div class="panel rating-panel">
          <button class="collapse-button" id="ratingToggle" type="button">
            ▶ Rating
          </button>
          <div id="ratingContent" class="rating-content collapsed">
            <div id="questionsContainer" class="questions"></div>
            <button
              class="btn btn-primary"
              id="submitRatingButton"
              type="button"
            >
              Submit rating
            </button>
          </div>
        </div>
      </div>
    </template>
    <script src="navigation.js"></script>
  </body>
</html>
